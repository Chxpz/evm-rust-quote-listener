[package]
name = "listener"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }  # Runtime async
tokio-tungstenite = "0.17"                      # WebSocket client
serde = { version = "1.0", features = ["derive"] } 
serde_json = "1.0"                              
futures-util = "0.3"
ethers = {version = "2.0.14", features = ["ws"]}   
dotenv = "0.15"  
tracing = "0.1"
tracing-subscriber = "0.3"                       